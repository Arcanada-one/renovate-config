name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull-request branch supersedes that branch's older run, which
# otherwise keeps queueing on the shared self-hosted runners. Only pull_request
# runs are ever cancelled: push (main), tag, schedule and workflow_dispatch runs get
# a group unique to the run, so they are never cancelled or replaced while pending.
# Job-level deploy locks are separate groups and are not touched.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  renovate-config-validator:
    runs-on: [self-hosted, linux, arcana-prod]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Validate preset JSON files
        run: npx --yes --package renovate -- renovate-config-validator default.json nestjs.json react.json
